version: '3.8'

services:
  # 1. The Redis Database
  redis:
    image: redis:alpine
    container_name: local-redis
    ports:
      - "6380:6379"
    
  mysql:
    image: mysql:8.0
    container_name: local-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=adobedb
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. The FastAPI Backend
  backend:
    build: 
      context: ./Backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app  # This enables live-reloading when you save Python files
    env_file:
      - .env            # This loads your API keys
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  # 3. The React Frontend
  # 3. The React Frontend
  frontend:
    build: 
      context: ./Frontend
    container_name: react-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app               # Maps the ENTIRE folder (including index.html & Vite config)
      - /app/node_modules             # Shields the container's isolated node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true      # Ensures file saves trigger a reload on Windows
    depends_on:
      - backend

volumes:
  mysql_data: